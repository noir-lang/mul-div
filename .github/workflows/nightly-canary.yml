name: Noir nightly compatibility probe
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install oracle server dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Run tests
        run: ./scripts/run.sh
