name: Test
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: 1.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install oracle server dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Check formatting
        run: nargo fmt --check
      - name: Run tests
        run: ./scripts/run.sh --deny-warnings
